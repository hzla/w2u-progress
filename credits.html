<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>White2Upgrade Animation Credits</title>
    <link rel="stylesheet" href="styles.css?v=20261011-integration-assets">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div><p class="eyebrow">White2Upgrade</p><h1>Animation Credits</h1></div>
        <div class="toolbar"><a class="tool-button" href="index.html">Back to Tracker</a><a class="tool-button" href="animation-viewer/">Animation Viewer</a></div>
      </header>
      <main>
        <p id="credit-policy" class="save-status">Loading selected-source credits…</p>
        <h2>Move animations</h2>
        <section class="tracker-panel"><div class="table-scroll"><table><thead><tr><th>Move</th><th>Animation credit</th></tr></thead><tbody id="move-credits"></tbody></table></div></section>
        <h2>Pokémon animations</h2>
        <section class="tracker-panel"><div class="table-scroll"><table><thead><tr><th>Pokémon / Form</th><th>Animation credit</th></tr></thead><tbody id="pokemon-credits"></tbody></table></div></section>
      </main>
    </div>
    <script src="credits.js?v=20261011-integration-assets" defer></script>
  </body>
</html>
